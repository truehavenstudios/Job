:root{
  --bg:#F8F4F0;--bg2:#F1EBE5;--card:#FFFFFF;--ink:#2F2A27;--ink2:#6A615B;--ink3:#8C837C;
  --line:#EAE2DA;--line2:#DCD2C8;--shadow:0 1px 2px rgba(70,50,40,.05),0 10px 30px rgba(70,50,40,.06);
  --a:#94665F;--a1:#F4E6E3;--a2:#E7CDC8;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC;
  --ok:#3F6E48;--okbg:#E0EDE2;--warn:#86601B;--warnbg:#F6EBD3;--bad:#A0412F;--badbg:#F6DFDA;
  --p1:#E7A1A6;--p2:#9DCBA6;--p3:#B5A3D8;--p4:#97BFE0;--p5:#E3C08E;--p6:#F0AE95;--p7:#8FCFC6;--p8:#D39CC4;--p9:#C2C08A;--p10:#A3B1C4;
  --r:20px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Sage"]{--a:#5E7C64;--a1:#E5EEE6;--a2:#C9DDCC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Lavender"]{--a:#76689A;--a1:#ECE7F4;--a2:#D6CCE8;--b:#4F7193;--b1:#E3ECF5;--b2:#C8D9EA}
[data-theme="Sky"]{--a:#4F7193;--a1:#E3ECF5;--a2:#C8D9EA;--b:#76689A;--b1:#ECE7F4;--b2:#D6CCE8}
[data-theme="Sand"]{--a:#8A6D4E;--a1:#F2E9DE;--a2:#E3D2BD;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC}
[data-theme="Stone"]{--a:#6B635D;--a1:#EEEAE6;--a2:#DAD3CC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Mocha"]{--a:#6F5146;--a1:#F1E6E0;--a2:#DDC8BE;--b:#A3603F;--b1:#F7E7DD;--b2:#ECCDB9}
[data-theme="Ocean"]{--a:#3F6B78;--a1:#E1EDF0;--a2:#C3DAE0;--b:#8A6D4E;--b1:#F2E9DE;--b2:#E3D2BD}
[data-theme="Plum"]{--a:#73465F;--a1:#F2E5EC;--a2:#E2C8D6;--b:#9A5F7E;--b1:#F6E8EF;--b2:#EBCFDD}
[data-theme="Noir"]{--a:#34302D;--a1:#ECE8E3;--a2:#D9D2C9;--b:#8C6F3A;--b1:#F4ECDC;--b2:#E6D5B2}
html[data-dark="1"]{
  --bg:#1B1918;--bg2:#24211F;--card:#2A2725;--ink:#F3EEEA;--ink2:#BDB4AD;--ink3:#8D847D;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#9CC8A5;--okbg:#2B3A2E;--warn:#E3BA72;--warnbg:#3D3324;--bad:#EC9E8F;--badbg:#45302B;color-scheme:dark;
}
/* the theme sits on <body>; dark tints must be set there too or the light tints win */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--a1:color-mix(in srgb,var(--a) 30%,#2A2725);--a2:color-mix(in srgb,var(--a) 50%,#9A928B);--b1:color-mix(in srgb,var(--b) 30%,#2A2725);--b2:color-mix(in srgb,var(--b) 50%,#9A928B)}
html[data-dark="1"] body[data-theme="Noir"]{--a:#57504A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:2.1em;line-height:1.08;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.3em;line-height:1.2}
h3{font-size:1.05em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.87em}.tiny{font-size:.77em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:250px;flex:none;padding:24px 14px 20px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{padding:2px 12px 16px}
.brand .k{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32em;display:block;line-height:1.1;margin-top:3px;letter-spacing:.02em}
.brand .arch{width:30px;height:34px;color:var(--a);margin-bottom:8px}
.navlabel{padding:14px 12px 5px;font-size:.64em}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.94em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--a);color:#fff;font-weight:500}
.nav.on svg{color:#fff}
.nav .badge{margin-left:auto}
.side .addbtn{margin:2px 0 6px;justify-content:center}
.main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1240px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .sub{margin-top:5px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.tabbar{display:none}
.mt{margin-top:18px}.mt0{margin-top:0}

/* ------------------------------------------------ cards with a colored title band (our signature) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0;overflow:hidden}
.card>.band{background:var(--a);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.card>.band.b{background:var(--b)}
.card>.band.soft{background:var(--a1);color:var(--ink)}
.card>.band.softb{background:var(--b1);color:var(--ink)}
.band .t{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.band .r{font-size:.8em;opacity:.9;display:flex;gap:8px;align-items:center}
.band .lnk{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:20px;padding:4px 11px;font-size:.92em}
.band.soft .lnk,.band.softb .lnk{background:var(--card)}
.card>.body{padding:18px 20px}
.card>.body.tight{padding:8px 20px 12px}
.card.pad{padding:18px 20px}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
/* key number tiles (like the spreadsheet) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:center;min-width:0;display:flex;flex-direction:column}
.tile>b{flex:1;display:flex!important;align-items:center;justify-content:center;padding:8px!important}
.grid.start{align-items:start}
.tiles{grid-auto-rows:1fr}
.tile .h{background:var(--a1);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:8px 6px;color:var(--ink)}
.tile:nth-child(even) .h{background:var(--b1)}
.tile b{display:block;font-family:var(--serif);font-weight:500;font-size:1.65em;padding:10px 8px 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78em;color:var(--ink2);padding:0 8px 11px}
.tile .s.ok{color:var(--ok)}.tile .s.bad{color:var(--bad)}

/* hero: safe to spend */
.hero{background:var(--b1);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--b2) 60%,transparent);text-align:center;display:flex;flex-direction:column}
.hero .band{background:var(--b);color:#fff;padding:11px 16px;font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.hero .in{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--serif);font-weight:500;font-size:3.9em;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}
.big .cur{font-size:.4em;margin-top:.3em;opacity:.7}
.big .ct{font-size:.4em;margin-top:.3em;opacity:.7}
.big.neg{color:var(--bad)}
.hero .line{color:var(--b);font-weight:500;margin-top:8px;font-size:.98em}
html[data-dark="1"] .hero .line{color:var(--ink)}
.hero .math{margin-top:12px;background:var(--card);border-radius:14px;padding:9px 14px;font-size:.84em;width:100%;max-width:340px;text-align:left}
.hero .math div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.hero .math .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:500}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:9px 16px;font-size:.92em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri2{background:var(--b);border-color:var(--b);color:#fff}
.btn.soft{background:var(--a1);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.84em}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--a);text-decoration:underline;text-underline-offset:3px;font-size:.88em;cursor:pointer}
html[data-dark="1"] .link{color:var(--a2)}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:max(11.5px,.74em);font-weight:500;background:var(--a1);color:var(--ink);white-space:nowrap}
.badge.b{background:var(--b1)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:30px;padding:6px 13px;font-size:.86em;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.monthpick{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line2);border-radius:30px;padding:3px}
.monthpick b{font-weight:500;min-width:128px;text-align:center;font-size:.94em}
.monthpick .iconbtn{width:30px;height:30px;border-radius:50%}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover .nm{text-decoration:underline;text-underline-offset:3px}
.nm{font-weight:500}
.date{width:44px;flex:none;text-align:center;border-radius:11px;background:var(--bg2);padding:5px 0 4px;line-height:1.05}
.date b{display:block;font-family:var(--serif);font-weight:500;font-size:1.18em}
.date span{font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.date.a{background:var(--a1)}.date.b{background:var(--b1)}.date.ok{background:var(--okbg)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.emo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:1.05em;background:var(--bg2)}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:14px;font-size:.92em}
.dayhead{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:14px 0 4px;font-weight:500}
.dayhead:first-child{padding-top:0}
.tag{font-size:.72em;background:var(--b1);border-radius:10px;padding:1px 7px;margin-left:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88em}
table.t th{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;text-align:right;padding:8px 6px;background:var(--b1);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:500;border-top:2px solid var(--line2)}
table.t td.over{background:var(--badbg);color:var(--bad)}
table.t td.cur{background:var(--a1)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--b);transition:width .6s}
.bar.a i{background:var(--a)}
.bar.over i{background:var(--bad)}
.bar.thick{height:13px}
.bar.mark{position:relative;overflow:visible}
.bar.mark u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
.budrow{padding:11px 0;border-top:1px solid var(--line)}
.budrow:first-child{border-top:0}
.budrow .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.budrow .sub2{display:flex;justify-content:space-between;font-size:.78em;color:var(--ink2);margin-top:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:.8em;color:var(--ink2);font-weight:500}
.inp{width:100%;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 13px;outline:none;font-size:1em;min-width:0}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 16%,transparent)}
.inp.sm{padding:6px 9px;font-size:.9em;border-radius:9px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:.78em;color:var(--ink3)}
.switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--line2);border:0;padding:0;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--b)}.switch.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--a)}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .e{width:54px;text-align:center;flex:none}.erow .n{flex:1 1 150px;min-width:0}.erow .a{width:100px;flex:none}.erow .g{width:110px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,30,25,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .22s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:1.2em}
.modal .mb{padding:16px 22px 18px}
.modal .mf{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal .mf .btn{flex:1 1 auto;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

/* add sheet */
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}
.kind button{border:0;background:none;border-radius:11px;padding:8px;font-weight:500;color:var(--ink2)}
.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amountview{text-align:center;padding:2px 0 6px}
.amountview input{border:0;background:none;text-align:center;font-family:var(--serif);font-size:2.8em;width:100%;outline:none;padding:0;font-variant-numeric:tabular-nums}
.plus{display:flex;gap:8px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.plus button{border:0;background:var(--a1);border-radius:30px;padding:6px 13px;font-weight:500;font-size:.86em}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}
.cat{border:1.5px solid var(--line2);background:var(--card);border-radius:30px;padding:6px 12px;font-size:.86em;display:inline-flex;gap:6px;align-items:center}
.cat.on{border-color:var(--a);background:var(--a1);font-weight:500}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2F2A27;color:#fff;border-radius:16px;padding:11px 12px 11px 18px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:pop .25s;max-width:calc(100vw - 28px);font-size:.92em}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;padding:6px 13px;font-weight:500}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:4px 0;font-weight:500}
.cday{min-height:96px;border-radius:12px;background:var(--bg2);padding:6px 7px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;min-width:0;text-align:left}
.cday.out{opacity:.3}
.cday.today{border-color:var(--a);background:var(--card)}
.cday.ns{background:var(--b1)}
.cday .d{font-size:.8em;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ev{font-size:.68em;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border-left:3px solid var(--a)}
.ev.income{border-left-color:var(--ok);background:var(--okbg)}
.ev.sub{border-left-color:var(--p3)}.ev.debt{border-left-color:var(--bad)}.ev.save{border-left-color:var(--b)}
.ev.spend{border-left:0;background:transparent;padding-left:1px;color:var(--ink2)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--bg2);font-style:normal;font-size:.56em;display:grid;place-items:center;color:var(--ink3)}
.mini i.ns{background:var(--b);color:#fff}.mini i.sp{background:var(--a1);color:var(--ink2)}.mini i.x{background:none}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px}
.minis h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:.95em;display:flex;justify-content:space-between}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink2);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.86em}
.legend div{display:flex;align-items:center;gap:9px}
.legend .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;flex:none;white-space:nowrap}
.legend .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78em;color:var(--ink2);margin-top:8px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap .legend{flex:1;min-width:0}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.flow i{display:block;height:100%;min-width:3px}
.tip{position:fixed;z-index:80;background:#2F2A27;color:#fff;font-size:12px;border-radius:8px;padding:5px 9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-120%)}

/* goals */
.jar{width:44px;height:58px;flex:none}
.goal .bigsum{font-family:var(--serif);font-size:1.8em;line-height:1.1}
.bigdate{font-family:var(--serif);font-size:2.5em;line-height:1.05}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .iconbtn{border:1px solid var(--line2);border-radius:50%;width:30px;height:30px}

/* onboarding */
.ob{max-width:580px;margin:5vh auto;padding:0 18px 60px}
.ob .steps{display:flex;gap:6px;margin:0 0 22px}
.ob .steps i{height:5px;flex:1;border-radius:5px;background:var(--line2)}
.ob .steps i.on{background:var(--a)}
.banner{background:var(--a);color:#fff;font-size:.85em;padding:8px 16px;text-align:center;position:sticky;top:0;z-index:40}
.banner a{color:#fff;font-weight:500}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.themes button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 7px;font-size:.78em;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button.on{border-color:var(--ink)}
.themes .sw{display:flex;width:100%;height:22px;border-radius:7px;overflow:hidden}
.themes .sw i{flex:1}

/* ------------------------------------------------ responsive */
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){
  .g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .main{padding:24px 22px 120px}
}
@media (max-width:760px){
  .side{display:none}
  .main{padding:16px 14px 110px;max-width:none}
  h1{font-size:1.55em}
  .big{font-size:3.2em}
  .card>.body{padding:15px 15px}
  .card>.band{padding:10px 14px}
  .topbar{margin-bottom:14px;align-items:flex-start}
  .topbar .acts .hide-m{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .tile b{font-size:1.4em}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .donutwrap{flex-direction:column;align-items:stretch}.donutwrap svg{align-self:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .tabbar a,.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink);text-decoration:none;padding:4px 6px;min-width:56px}
  .tabbar a svg,.tabbar button svg{width:21px;height:21px}
  .tabbar a.on{color:var(--a)}
  html[data-dark="1"] .tabbar a.on{color:var(--a2)}
  .tabbar .fab{width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 40%,transparent);min-width:0;padding:0}
  .tabbar .fab svg{width:24px;height:24px}
  .cday{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:5px;border-left:0;background:var(--a);border-radius:3px}
  .ev.income{background:var(--ok)}.ev.sub{background:var(--p3)}.ev.debt{background:var(--bad)}.ev.save{background:var(--b)}
  .ev.spend{font-size:9px;height:auto;background:none;color:var(--ink2)}
  .cal{gap:3px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;max-height:94dvh;max-width:none}
  .toast{bottom:92px}
  .monthpick b{min-width:104px}
}
@media print{.side,.tabbar,.topbar .acts{display:none}.main{padding:0}}
.item>svg{width:18px;height:18px;flex:none;color:var(--ink3)}
.nextcard .body{flex-wrap:wrap}.nextcard .grow{flex:1 1 220px}
@media (max-width:760px){.nextcard .nbtns{width:100%;justify-content:flex-start!important;padding-left:58px}}
@media (max-width:760px){.topbar .simpletog{display:none}}
.obhead,.obrow{display:grid;grid-template-columns:34px minmax(0,1fr) 104px 150px 156px 34px;gap:8px;align-items:center}
.obhead{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500;padding-bottom:6px}
.obrow{padding:7px 0;border-top:1px solid var(--line)}.obrow .e{text-align:center;font-size:1.15em}
.ob{max-width:760px}
@media (max-width:760px){.obhead{display:none}.obrow{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:6px}.obrow [data-obf=name]{grid-column:2/4}.obrow .iconbtn{grid-column:4;grid-row:1}.obrow [data-obf=amount]{grid-column:2}.obrow select{grid-column:3}.obrow [data-obf=next]{grid-column:2/4}}

/* ------------------------------------------------ debt payoff tracker */
.show-m{display:none!important}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero .bigdate{font-size:2.6em}

.item.opt{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;border-top:1px solid var(--line)}

.obhead.dh,.obrow.dh{grid-template-columns:34px minmax(0,1.4fr) 96px 86px 96px 76px 34px}

.tl{grid-template-columns:minmax(150px,240px) minmax(0,1fr)}

.hleg i.lg{width:12px;height:12px;border-radius:3px}
.lg.paid{background:var(--ok)}.lg.due{background:#5B82A6}.lg.missed{background:var(--bad)}.lg.planned{background:var(--ink3)}.lg.pd{background:var(--b);border-radius:50%!important;width:8px!important;height:8px!important}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--b);display:inline-block}
.cal{margin-top:8px}
.cday{min-height:88px}

.mb{margin-bottom:18px}

.note{display:flex;gap:9px;align-items:flex-start;border-radius:14px;padding:10px 13px;font-size:.86em;margin-top:12px;background:var(--bg2)}
.note svg{width:16px;height:16px;flex:none;margin-top:2px}

.note.sessn{background:var(--a);color:#fff;align-items:center}.note.sessn .btn{background:#fff;color:var(--a);border-color:#fff}
.cloudpill{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:6px 12px;font-size:.8em;color:var(--ink2);white-space:nowrap}.cloudpill.bad{color:var(--bad);border-color:var(--bad)}
/* goal coach */
.tots.t3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 4px}

.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 18px;border-radius:30px;border:1.5px solid var(--line2);background:#fff;color:#1f1f1f;font-size:1.05em;font-weight:500;box-shadow:var(--shadow);cursor:pointer}

/* ------------------------------------------------ job tracker: calm, quiet layer on top of base.css */
:root{--bg:#F7F5F2;--bg2:#EFECE7;--line:#E6E1DA;--line2:#D6CFC6;--r:14px;--shadow:none}
html[data-dark="1"]{--bg:#181716;--bg2:#232120;--card:#211F1E;--line:#33302D;--line2:#45413D}
h1{font-size:1.85em;text-transform:none;letter-spacing:0;line-height:1.15}
h2{font-family:var(--sans);font-size:.98em;font-weight:600;letter-spacing:0}
.inl{width:1em;height:1em;vertical-align:-.15em;display:inline-block;margin-left:3px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.click{cursor:pointer}
.mb16{margin-bottom:16px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inp.auto{width:auto}
textarea.inp{resize:vertical;line-height:1.5}
.seg.wide{display:flex}.seg.wide button{flex:1}

/* shell */
.side{width:232px;background:var(--bg);border-right:1px solid var(--line);padding:22px 12px 18px}
.brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand .arch{width:24px;height:28px;color:var(--a);margin-bottom:10px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.3em;margin:0;letter-spacing:0}
.brand span{font-size:.72em;color:var(--ink3)}
.side .addbtn{margin:0 0 14px}
.nav{padding:7px 10px;border-radius:9px;font-size:.92em}
.nav.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.nav.on svg{color:var(--a)}
html[data-dark="1"] .nav.on svg{color:var(--a2)}
.nav .count{margin-left:auto;font-size:.78em;color:var(--ink2);font-variant-numeric:tabular-nums}
.navsep{height:1px;background:var(--line);margin:10px 10px}
.main{padding:30px 40px 120px;max-width:1180px}
.topbar{align-items:flex-end;margin-bottom:24px}
.topbar .sub{font-size:.82em;color:var(--ink2);margin:0 0 4px}

/* cards */
.card{border-radius:var(--r);box-shadow:none;border:1px solid var(--line)}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.chr{display:flex;align-items:center;gap:6px}
.card>.body{padding:12px 20px 18px}
.sec{font-size:.74em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
.btn{border-radius:10px;padding:8px 14px;font-size:.9em;font-weight:500}
.btn.sm{padding:5px 11px;font-size:.82em;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg2);color:var(--ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.05)}
.link{text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.inp{border-radius:10px;border-width:1px}
.seg{border-radius:10px}.seg button{border-radius:8px}
.empty{border:0;background:var(--bg2);border-radius:12px;color:var(--ink2)}
.item{padding:11px 0}
.date{border-radius:9px;background:var(--bg2)}
.date b{font-family:var(--sans);font-weight:600;font-size:1.05em}
.tag{background:var(--okbg);color:var(--ok);font-size:.72em;border-radius:6px;padding:1px 6px;margin-left:4px}

/* status, next step */
.st{display:inline-flex;align-items:center;gap:6px;font-size:.8em;color:var(--ink2);white-space:nowrap}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.nstep{color:var(--ink2)}.nstep.hot{color:var(--bad)}.nstep.quiet{color:var(--ink3)}.nstep.iv{color:var(--ink)}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:600;font-size:.72em;background:var(--bg2)!important;color:var(--ink2)}
.logo.sm{width:28px;height:28px}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;max-width:46%}
.rcol .nstep{text-align:right}
.okc{color:var(--ok)}.badc{color:var(--bad)}

/* today */
.todos{display:flex;flex-direction:column}
.todo{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0;padding-top:4px}
.tdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3);margin-top:-14px}
.k-iv .tdot{background:var(--a)}.k-deadline .tdot,.k-offer .tdot{background:var(--warn)}.k-follow .tdot,.k-thanks .tdot{background:var(--b)}.k-quiet .tdot{background:var(--line2)}
.tdb{display:flex;gap:4px;flex:none}
.todo .nm.click:hover{text-decoration:underline;text-underline-offset:3px}
.wk{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.wk b{font-family:var(--serif);font-weight:500;font-size:2.4em;line-height:1}
.wk span{color:var(--ink2);font-size:.9em}
.bar{height:6px;background:var(--bg2)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:12px 0 14px;font-size:.9em}
dl.kv dt{color:var(--ink2)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pstep{text-decoration:none;color:var(--ink);background:var(--bg2);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;min-width:0}
.pstep b{font-family:var(--serif);font-weight:500;font-size:1.5em;line-height:1.1}
.pstep span{font-size:.72em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.8em;color:var(--ink2)}
.stat b{font-family:var(--serif);font-weight:500;font-size:1.8em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:.78em;color:var(--ink3)}

/* board */
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:15px;height:15px;color:var(--ink3);pointer-events:none}
.search .inp{padding-left:30px;min-width:170px}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr)) minmax(170px,.8fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start;scroll-snap-type:x proximity}
.bcol{background:var(--bg2);border-radius:14px;padding:8px;min-height:240px;scroll-snap-align:start;transition:background .15s,box-shadow .15s}
.bcol.dropok{box-shadow:inset 0 0 0 2px var(--a)}
.bhead{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-size:.88em}
.bhead b{font-weight:600}.bhead span{color:var(--ink3)}
.blist{display:flex;flex-direction:column;gap:6px}
.bcard{background:var(--card);border-radius:10px;padding:11px 12px;border:1px solid var(--line);cursor:grab;display:flex;flex-direction:column;gap:3px;transition:border-color .12s}
.bcard:hover{border-color:var(--line2)}
.bcard.dragging{opacity:.45}
.bcard .nm{font-size:.93em;line-height:1.25}
.bcard.isquiet{opacity:.65}
.bcard.closed{padding:8px 11px}
.bfoot{margin-top:6px}
.mvbtn{border:0;background:transparent;border-radius:7px;width:26px;height:26px;display:grid;place-items:center;color:var(--ink3);flex:none}
.mvbtn:hover{background:var(--bg2);color:var(--ink)}.mvbtn svg{width:15px;height:15px}
.bempty{border:1px dashed var(--line2);border-radius:10px;padding:16px 10px;text-align:center;font-size:.8em;color:var(--ink3)}
.bcol .link{margin:6px 8px;font-size:.84em}
.bjump{display:none;overflow-x:auto;flex-wrap:nowrap;max-width:100%;margin-bottom:10px;scrollbar-width:none}.bjump::-webkit-scrollbar{display:none}
.bjump button{white-space:nowrap}

/* list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .search .inp{width:100%}
table.t th{background:transparent;color:var(--ink2);font-size:.72em;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.jobs td,table.jobs th{text-align:left;white-space:nowrap}
table.jobs td{padding:11px 10px;vertical-align:middle}
table.jobs tr.click:hover td{background:var(--bg)}
table.jobs td:first-child{white-space:normal;min-width:220px}
.show-mb{display:none}

/* calendar */
.cday{cursor:pointer;font:inherit;color:inherit;background:var(--bg);border:1px solid transparent;border-radius:9px;min-height:84px}
.cday:hover{border-color:var(--line2)}
.cday.today{border-color:var(--a);background:var(--card)}
.ev{border-left:3px solid var(--line2);background:var(--card);border-radius:4px}
.ev-iv{border-left-color:var(--a)}.ev-dl{border-left-color:var(--warn)}.ev-fu{border-left-color:var(--b)}.ev-od{border-left-color:var(--p8)}
.evmore{font-size:.66em;color:var(--ink2);padding-left:3px}
.hleg{margin-top:12px}
i.lg{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.lg.ev-iv{background:var(--a)}.lg.ev-dl{background:var(--warn)}.lg.ev-fu{background:var(--b)}.lg.ev-od{background:var(--p8)}

/* insights */
.funnel{display:flex;flex-direction:column;gap:10px}
.frow2{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88em}
.fl{color:var(--ink2)}
.fb{position:relative;height:26px;background:var(--bg2);border-radius:7px;overflow:hidden}
.fb i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--a2)}
.fb b{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:600}
.fp{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* offers */
table.cmp td,table.cmp th{text-align:left;vertical-align:top;white-space:normal;padding:10px 12px}
table.cmp td:first-child{color:var(--ink2);white-space:nowrap}
table.cmp th{text-transform:none;letter-spacing:0;font-size:1em;color:var(--ink);min-width:170px}
table.cmp tr.tot td{background:var(--bg);border-top:1px solid var(--line2)}

/* detail */
.modal{border-radius:18px}
.modal .mh h2{font-family:var(--sans);font-size:1em;font-weight:600}
.dhead{display:flex;gap:14px;align-items:flex-start}
.dco{font-family:var(--serif);font-size:1.55em;line-height:1.15}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px -22px 0;padding:0 22px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{border:0;background:none;padding:10px 12px;font-size:.88em;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.dtabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.dbody{padding-top:16px}
.fubox{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg2);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.fubox .grow{flex:1 1 200px}
.tline{display:flex;flex-direction:column;border-left:1px solid var(--line2);margin-left:4px;padding-left:14px}
.tline div{display:flex;gap:10px;font-size:.86em;padding:3px 0;position:relative}
.tline div:before{content:"";position:absolute;left:-18px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tline em{font-style:normal;color:var(--ink3);margin-left:auto}
.adtxt{font-size:.9em;line-height:1.55}
.pastebox{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.pastebox .inp{margin-top:8px;background:var(--card)}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:11px;border:0;background:none;padding:7px 2px;text-align:left;font-size:.92em;color:var(--ink)}
.chk span{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.chk span svg{width:13px;height:13px}
.chk.on{color:var(--ink2);text-decoration:line-through}
.chk.on span{background:var(--ok);border-color:var(--ok);color:#fff}
.morei svg{width:18px;height:18px;color:var(--ink2);flex:none}
.item.opt{text-decoration:none;color:inherit}

/* job search log */
.wkrow{display:flex;gap:10px;flex-wrap:wrap}
.wkc{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.wkc b{font-family:var(--serif);font-size:1.5em;font-weight:500;line-height:1.1}.wkc span{font-size:.74em;color:var(--ink2)}.wkc em{font-style:normal;font-size:.76em;font-weight:500;margin-top:3px;color:var(--ink3)}
.wkc.ok em{color:var(--ok)}.wkc.bad em{color:var(--bad)}
table.log td,table.log th{text-align:left;white-space:normal;vertical-align:top}table.log td:first-child{white-space:nowrap}
table.log{min-width:760px}
table.log tr.click:hover td{background:var(--bg);cursor:pointer}
#printArea{display:none}
.logdoc{font-family:Arial,sans-serif;color:#111;font-size:11px}.logdoc h1{font-family:Georgia,serif;font-size:22px;margin:0 0 6px}
.logdoc table{width:100%;border-collapse:collapse;margin-top:12px}.logdoc th,.logdoc td{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top}.logdoc th{background:#eee;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.logdoc td:first-child{white-space:nowrap}.logdoc .sig{margin-top:28px}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body.printing{background:#fff!important}
  #printArea .paper{padding:.4in}
}
.cloudpill{border-radius:10px}
.sitefoot{border-top:1px solid var(--line)}

@media (max-width:980px){.board{grid-template-columns:repeat(5,minmax(220px,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .main{padding:18px 14px 110px}
  h1{font-size:1.5em}
  .todo{flex-wrap:wrap;row-gap:8px}.tdb{width:100%;padding-left:20px}
  .board{grid-template-columns:repeat(5,82vw);margin:0 -14px;padding:0 14px 12px;scroll-snap-type:x mandatory;gap:10px}
  .bcol{min-height:60vh}
  .hide-m{display:none!important}.show-mb{display:block}.seg.bjump{display:flex}
  .filters .search{flex-basis:100%}
  .frow3{grid-template-columns:1fr 1fr}.frow3>.field:last-child{grid-column:1/-1}

  .cday{min-height:52px}
  .frow2{grid-template-columns:80px minmax(0,1fr) 38px}
  .item .rcol .nstep{display:none}
  .tabbar a.on,.tabbar button.on{color:var(--ink)}
}

.hb{display:flex;flex-direction:column;gap:9px}
.hbr{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.86em}

.oct{position:relative}.oct .sb{margin:0}.oct u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;text-decoration:none}
.hmwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

details summary{cursor:pointer;color:var(--ink2)}
@media (max-width:760px){.hbr{grid-template-columns:84px minmax(0,1fr) 78px}.ocr{grid-template-columns:80px minmax(0,1fr) 58px}}

const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return ([1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10].find(x => n <= x + 1e-9)) * p; };

/* Job tracker logic: status changes, today's to-dos, stats, job match, emails, calendar export, CSV */
const RESP = ["interview", "offer", "accepted", "rejected"];      // the company answered
const INTV = ["interview", "offer", "accepted"];                  // reached an interview
const OFFR = ["offer", "accepted"];
const wasApplied = a => !!a.applied || a.status !== "wish";
const reached = (a, set) => set.includes(a.status) || a.history.some(h => set.includes(h.s)) || (set === INTV && S.interviews.some(i => i.app === a.id));
const lastTouch = a => [a.applied, a.created, ...a.history.map(h => h.d), ...a.followed].filter(Boolean).sort().pop() || a.created;
const appIvs = id => S.interviews.filter(i => i.app === id).sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
const nextIv = id => appIvs(id).find(i => i.date >= today() && i.outcome === "pending");
const quietDays = a => a.status === "applied" ? daysAgo(lastTouch(a)) : 0;

// one place for every status change: keeps dates, history and follow-ups right
function setStatus(a, s, d = today()) {
  if (!STATUS[s] || a.status === s) return;
  a.status = s; a.history.push({ d, s });
  if (s !== "wish" && !a.applied) a.applied = d;
  if (s === "applied" && !a.follow) a.follow = D.add(d, S.settings.followDays);
  if (CLOSED.includes(s) || s === "offer") a.follow = "";
  if (s === "offer" && !a.offer) a.offer = { base: a.salMax || a.salMin || 0, bonus: 0, equity: 0, perks: 0, pto: 0, deadline: D.add(d, 7), start: "", notes: "", scores: Object.fromEntries(Object.keys(CRIT).map(k => [k, 3])) };
}

// ------------------------------------------------------------ today: what needs doing now
function todos() {
  const t = today(), out = [];
  for (const a of S.apps) {
    if (a.status === "wish" && a.deadline && D.diff(t, a.deadline) <= 3 && D.diff(t, a.deadline) >= -1)
      out.push({ k: "deadline", a, pri: 1, when: a.deadline, title: `Apply to ${a.company}`, sub: `${a.role} · deadline ${rel(a.deadline)}` });
    if (["applied", "interview"].includes(a.status) && a.follow && a.follow <= t && !isQuiet(a))
      out.push({ k: "follow", a, pri: 2, when: a.follow, title: `Follow up with ${a.company}`, sub: `${a.role} · ${a.followed.length ? "last follow-up " + rel(a.followed[a.followed.length - 1]) : "applied " + rel(a.applied || a.created)}` });
    if (isQuiet(a)) out.push({ k: "quiet", a, pri: 4, when: lastTouch(a), title: `No reply from ${a.company} in ${quietDays(a)} days`, sub: `${a.role} · send one last follow-up or mark it as ghosted` });
    if (a.status === "offer" && a.offer && a.offer.deadline && D.diff(t, a.offer.deadline) <= 5)
      out.push({ k: "offer", a, pri: 1, when: a.offer.deadline, title: `Answer the offer from ${a.company}`, sub: `${a.role} · reply ${rel(a.offer.deadline)}` });
  }
  for (const i of S.interviews) {
    const a = appById(i.app); if (!a) continue;
    const n = D.diff(t, i.date);
    if (i.outcome === "pending" && n >= 0 && n <= 2) out.push({ k: "iv", a, i, pri: 0, when: i.date, title: `${IKIND[i.kind]} with ${a.company}`, sub: `${rel(i.date)}${i.time ? " · " + ftime(i.time) : ""} · round ${i.round}${i.who ? " · " + i.who : ""}` });
    if (!i.thanked && n < 0 && n >= -3) out.push({ k: "thanks", a, i, pri: 1, when: i.date, title: `Send a thank-you to ${a.company}`, sub: `after your ${IKIND[i.kind].toLowerCase()} ${rel(i.date)} – within 24 h is best` });
  }
  return out.sort((x, y) => x.pri - y.pri || x.when.localeCompare(y.when));
}

  let ws = D.add(D.weekStart(today()), -7), n = 0;

  G.busy = true; renderSyncPill();

document.addEventListener("pointermove", e => {
  const svg = e.target.closest && e.target.closest(".lchart"); $$(".xtip").forEach(x => x.remove());

  const pts = JSON.parse(svg.dataset.pts), r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = vb.width / r.width, x = (e.clientX - r.left) * sx;
  let k = 0; pts.forEach((p, i) => { if (Math.abs(p[0] - x) < Math.abs(pts[k][0] - x)) k = i; });
  const p = pts[k]; svg.classList.add("hov");
  const ln = svg.querySelector(".xh"), d = svg.querySelector(".xd"); ln.setAttribute("x1", p[0]); ln.setAttribute("x2", p[0]); d.setAttribute("cx", p[0]); d.setAttribute("cy", p[1]);

// activity heatmap: one cell per day, single-hue ramp
function heatmap(weeks) {
  const t = today(), ws = S.settings.weekStart, start = D.add(D.weekStart(t), -7 * (weeks - 1)), cnt = {};
  S.apps.forEach(a => { if (a.applied) cnt[a.applied] = (cnt[a.applied] || 0) + 1; });
  S.interviews.forEach(i => { if (i.date <= t) cnt[i.date] = (cnt[i.date] || 0) + 1; });
  S.apps.forEach(a => a.followed.forEach(d => cnt[d] = (cnt[d] || 0) + 1));
  const lvl = n => n >= 4 ? 4 : n;
  let cols = "", mon = "", active = 0;
  for (let w = 0; w < weeks; w++) {
    const wd = D.add(start, 7 * w); let col = "";
    for (let k = 0; k < 7; k++) { const d = D.add(wd, k), n = cnt[d] || 0; if (n) active++; col += `<i class="hm l${d > t ? "x" : lvl(n)}" data-tip="${esc(d > t ? "" : `${dlong(d)}: ${n ? plural(n, "action") : "nothing"}`)}"></i>`; }
    cols += `<div class="hmc">${col}</div>`;
    const dd = D.pd(wd); mon += `<span>${dd.getDate() <= 7 ? MON[dd.getMonth()] : ""}</span>`;
  }
  const days = (ws === 0 ? ["S", "M", "T", "W", "T", "F", "S"] : ["M", "T", "W", "T", "F", "S", "S"]).map((d, i) => `<span>${i % 2 ? "" : d}</span>`).join("");

    <div class="hmleg"><span class="muted tiny">${active} active days in ${weeks} weeks</span><span class="tiny muted">Less</span>${[0, 1, 2, 3, 4].map(l => `<i class="hm l${l}"></i>`).join("")}<span class="tiny muted">More</span></div>`;
}

  if (iv) return { t: `${IKIND[iv.kind]} ${rel(iv.date)}${iv.time ? " · " + ftime(iv.time) : ""}`, c: "iv" };
  if (a.status === "offer" && a.offer && a.offer.deadline) return { t: `Reply to offer ${rel(a.offer.deadline)}`, c: D.diff(today(), a.offer.deadline) <= 2 ? "hot" : "" };

// ------------------------------------------------------------ calendar
function vCalendar() {
  const t = today(), m = VS.cm || D.month(t), first = m + "-01", ws = S.settings.weekStart;
  const start = D.add(first, -((D.pd(first).getDay() - ws + 7) % 7)), dim = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate(), last = `${m}-${String(dim).padStart(2, "0")}`;
  const end = D.add(last, (6 - (D.pd(last).getDay() - ws + 7) % 7));
  const ev = events(start, end).filter(e => e.k !== "ap"), byDay = {}; ev.forEach(e => (byDay[e.d] = byDay[e.d] || []).push(e));
  const heads = (ws === 0 ? ["Sun", ...DOWS.slice(0, 6)] : DOWS).map(d => `<div class="dow">${d}</div>`).join("");
  let cells = "";
  for (let d = start; d <= end; d = D.add(d, 1)) {
    const list = byDay[d] || [];
    cells += `<button class="cday ${d.slice(0, 7) !== m ? "out" : ""} ${d === t ? "today" : ""}" data-act="calDay" data-d="${d}"><div class="d"><span>${+d.slice(8)}</span></div>${list.slice(0, 3).map(e => `<div class="ev ev-${e.k}">${e.time ? ftime(e.time).replace(":00", "") + " " : ""}${esc(e.a.company)}</div>`).join("")}${list.length > 3 ? `<div class="evmore">+${list.length - 3}</div>` : ""}</button>`;
  }
  const up = events(t, D.add(t, 45)).filter(e => e.k !== "ap");
  const legend = `<div class="hleg">${["iv", "dl", "fu", "od"].map(k => `<span><i class="lg ev-${k}"></i>${EVK[k]}</span>`).join("")}</div>`;
  return topbar("Calendar", "", `<button class="btn" data-act="icsAll">${ic("bell")}Add all to my phone's calendar</button>`) +
    `<div class="grid g21 start"><section class="card"><header class="ch"><h2>${mname(m)}</h2><div class="chr"><button class="iconbtn" data-act="cm" data-v="-1" aria-label="Previous month">${ic("left")}</button><button class="btn sm ghost" data-act="cm" data-v="0">Today</button><button class="iconbtn" data-act="cm" data-v="1" aria-label="Next month">${ic("right")}</button></div></header><div class="body"><div class="cal">${heads}${cells}</div>${legend}</div></section>
    ${card("Coming up", up.length ? `<div class="list">${up.slice(0, 14).map(evRow).join("")}</div>` : `<div class="empty">Nothing in the next 6 weeks.</div>`)}</div>`;
}
function evRow(e) {
  return `<div class="item"><div class="date"><b>${+e.d.slice(8)}</b><span>${MON[+e.d.slice(5, 7) - 1]}</span></div><div class="grow click" data-act="open" data-id="${e.a.id}"><div class="nm"><i class="lg ev-${e.k}"></i>${esc(e.t)}</div><div class="small muted">${rel(e.d)}${e.time ? " · " + ftime(e.time) : ""}${e.s ? " · " + esc(e.s) : ""}</div></div>

}

// ------------------------------------------------------------ insights
function vInsights() {
  const t = today(), from = VS.insRange ? D.add(t, -VS.insRange) : "0000", apps = S.apps.filter(a => (a.applied || a.created) >= from), s = stats(apps);
  const nW = VS.insRange === 30 ? 6 : VS.insRange === 90 ? 13 : Math.min(26, Math.max(8, Math.ceil(D.diff(S.apps.map(a => a.applied || a.created).sort()[0] || t, t) / 7) + 1));
  const weeks = Array.from({ length: nW }, (_, i) => D.add(D.weekStart(t), -7 * (nW - 1 - i))), inW = (d, w) => d && d >= w && d <= D.add(w, 6);
  const wkChart = card("Applications & replies per week", colChart([{ name: "Applied", color: CC[0], vals: weeks.map(w => S.apps.filter(a => inW(a.applied, w)).length) }, { name: "Got a reply", color: CC[1], vals: weeks.map(w => S.apps.filter(a => inW(respDate(a), w)).length) }],
    weeks.map(w => dshort(w)), { every: nW > 8 ? 2 : 1, ref: S.settings.weekGoal || 0, totals: true, tipLabel: i => "Week of " + dshort(weeks[i]), label: "Applications and replies per week" }));
  const parts = [...OPEN.map(k => ({ n: STATUS[k].n, v: apps.filter(a => a.status === k).length, c: STC[k] })), { n: "Closed", v: apps.filter(a => CLOSED.includes(a.status)).length, c: STC.closed }];
  const ring = card("Where your jobs are", ringChart(parts, fint(apps.length), "jobs"));
  const fun = [["Applied", s.applied], ["Got a reply", s.resp], ["Interview", s.iv], ["Offer", s.offer]];
  const funnel = card("Funnel", hbars(fun.map(([n, v], i) => ({ n, v, d: fint(v), s: i && s.applied ? pct(v / s.applied) : "", c: CC[0], tip: `${n}: ${fint(v)}${i && s.applied ? " · " + pct(v / s.applied) + " of applications" : ""}` })), { max: s.applied }) + `<p class="tiny faint mt">Typical: 10–25% get a reply, 5–15% an interview.</p>`);
  const src = groupStats(a => a.source).filter(r => r.k !== "Not set");
  const bySrc = card("Interview rate by source", src.length ? hbars(src.map(r => ({ n: r.k, v: r.ir, d: pct(r.ir), s: `${r.iv} of ${r.applied}`, tip: `${r.k}: ${r.iv} interviews from ${r.applied} applications (${pct(r.ir)}), ${pct(r.rr)} replied` }))) +
    `<details class="mt"><summary class="tiny">Show as table</summary><div class="scrollx"><table class="t"><thead><tr><th></th><th>Applied</th><th>Replies</th><th>Interviews</th><th>Offers</th></tr></thead><tbody>${src.map(r => `<tr><td>${esc(r.k)}</td><td>${r.applied}</td><td>${pct(r.rr)}</td><td>${pct(r.ir)}</td><td>${r.offer}</td></tr>`).join("")}</tbody></table></div></details>` : `<div class="empty">Set “Found it via” on your jobs to see this.</div>`);
  const rd = apps.filter(wasApplied).map(replyDays).filter(x => x != null), bk = [["0–3", 0, 3], ["4–7", 4, 7], ["8–14", 8, 14], ["15–21", 15, 21], ["22–30", 22, 30], ["30+", 31, 9999]];
  const reply = card("Time to first reply", rd.length ? colChart([{ name: "Replies", color: CC[2], vals: bk.map(([, a, b]) => rd.filter(x => x >= a && x <= b).length) }], bk.map(b => b[0] + " d"), { tipLabel: i => bk[i][0] + " days after applying", label: "Days until the company replied" }) + `<p class="tiny faint mt">Most replies come within ${(() => { const so = [...rd].sort((a, b) => a - b); return so[Math.floor(so.length * .8)] || 0; })()} days – after that, a follow-up helps.</p>` : `<div class="empty">No replies yet.</div>`);
  const cum = weeks.map(w => S.apps.filter(a => a.applied && a.applied <= D.add(w, 6)).length);
  const total = card("Applications in total", lineChart(cum, weeks.map(w => dshort(w)), { ticks: [0, Math.floor((nW - 1) / 2), nW - 1], tip: i => `Week of ${dshort(weeks[i])}: ${fint(cum[i])} in total`, label: "Total applications over time" }));
  return topbar("Insights", "", `<div class="seg">${[[30, "30 days"], [90, "90 days"], [0, "All time"]].map(([k, n]) => `<button class="${VS.insRange === k ? "on" : ""}" data-act="insRange" data-v="${k}">${n}</button>`).join("")}</div>`) +
    `<div class="stats">${tile("Applied", fint(s.applied))}${tile("Reply rate", pct(s.rr), `${s.resp} replies`)}${tile("Interview rate", pct(s.ir), `${s.iv} interviews`)}${tile("Avg. time to reply", s.avgReply ? Math.round(s.avgReply) + " days" : "–")}</div>` +
    `<div class="grid g21 start mt">${wkChart}${ring}</div><div class="grid g2 start mt">${funnel}${bySrc}</div><div class="grid g2 start mt">${reply}${total}</div><div class="mt">${card("Your activity", heatmap(matchMedia("(max-width:760px)").matches ? 15 : 20), { right: `<span class="tiny muted">applications, follow-ups and interviews per day</span>` })}</div>`;
}

/* Interviews (with notes per round) and Offers (side by side) */
const PREP = [["co", "Read up on the company"], ["ad", "Re-read the job ad"], ["ex", "Prepare 2–3 examples from your experience"], ["qs", "Write down questions to ask them"], ["tech", "Test the link, camera and mic – or plan the route"]];

const ASK = ["What does success look like in the first 90 days?", "What's the biggest challenge for the team right now?", "How do you measure performance in this role?", "What do you enjoy most about working here?", "What are the next steps – and when can I expect to hear back?"];

  const t = today(), up = S.interviews.filter(i => i.outcome === "pending" && i.date >= t).sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));

    ${card("Past – your notes", past.length ? `<div class="list">${past.map(row).join("")}</div><p class="tiny faint mt">What they asked and how you answered – read it before the next round.</p>` : `<div class="empty">After an interview, write down what they asked. It helps a lot in the next round.</div>`)}</div>`;
}

// ------------------------------------------------------------ offers: side by side
const totalComp = o => (o.base || 0) + (o.bonus || 0) + (o.equity || 0) + (o.perks || 0);
function vOffers() {
  const L = S.apps.filter(a => a.offer && ["offer", "accepted"].includes(a.status)).sort((x, y) => totalComp(y.offer) - totalComp(x.offer)), tgt = S.settings.targetPay;
  if (!L.length) return topbar("Offers") + `<div class="empty">No offers yet. When a job reaches “Offer”, add the details and compare them here side by side.</div>`;
  const best = totalComp(L[0].offer), c = a => curOf(a);
  const rows = [["Base salary", a => money(a.offer.base, c(a))], ["Bonus", a => a.offer.bonus ? money(a.offer.bonus, c(a)) : "–"], ["Equity per year", a => a.offer.equity ? money(a.offer.equity, c(a)) : "–"], ["Benefits value", a => a.offer.perks ? money(a.offer.perks, c(a)) : "–"],
    ["Total per year", a => `<b>${money(totalComp(a.offer), c(a))}</b>${L.length > 1 && totalComp(a.offer) === best ? ` <span class="tag">highest</span>` : ""}${tgt ? `<div class="tiny ${totalComp(a.offer) >= tgt ? "okc" : "badc"}">${totalComp(a.offer) >= tgt ? "+" : "−"}${money(Math.abs(totalComp(a.offer) - tgt), c(a))} vs your target</div>` : ""}`, "tot"],
    ["Paid days off", a => a.offer.pto ? a.offer.pto + " days" : "–"], ["Work type", a => WORK[a.work] || "–"], ["Location", a => esc(a.location || "–")], ["Start date", a => a.offer.start ? dshort(a.offer.start) : "–"],
    ["Reply by", a => a.status === "accepted" ? "Accepted" : a.offer.deadline ? `${dshort(a.offer.deadline)} <span class="tiny muted">(${rel(a.offer.deadline)})</span>` : "–"], ["Notes", a => `<span class="small">${esc(a.offer.notes || "–")}</span>`]];
  const maxT = Math.max(...L.map(a => totalComp(a.offer)), tgt || 0), comp = [["Base", "base", CC[0]], ["Bonus", "bonus", CC[1]], ["Equity", "equity", CC[2]], ["Benefits", "perks", CC[3]]];
  const chart = card("Total pay per year", `<div class="oc">${L.map(a => `<div class="ocr"><span class="hbn"><b>${esc(a.company)}</b></span><div class="oct"><div style="width:${totalComp(a.offer) / maxT * 100}%">${stackBar(comp.map(([n, k, col]) => ({ n, v: a.offer[k] || 0, c: col, d: money(a.offer[k] || 0, c(a)) })), true)}</div>${tgt ? `<u style="left:${tgt / maxT * 100}%" data-tip="Your target: ${esc(money(tgt, c(a)))}"></u>` : ""}</div><span class="hbv">${money(totalComp(a.offer), c(a), true)}</span></div>`).join("")}</div>
    ${legend(comp.map(([n, , col]) => [col, n]))}${tgt ? `<p class="tiny faint">The thin line is your target salary (${money(tgt)}).</p>` : ""}`);
  return topbar("Offers", plural(L.length, "offer")) + chart + `<div class="card mt"><div class="scrollx"><table class="t cmp"><thead><tr><th></th>${L.map(a => `<th><div class="nm">${esc(a.company)}</div><div class="tiny muted">${esc(a.role)}</div></th>`).join("")}</tr></thead>
    <tbody>${rows.map(([n, f, cls]) => `<tr class="${cls || ""}"><td>${n}</td>${L.map(a => `<td>${f(a)}</td>`).join("")}</tr>`).join("")}<tr><td></td>${L.map(a => `<td><button class="btn sm" data-act="offerEdit" data-id="${a.id}">Edit</button></td>`).join("")}</tr></tbody></table></div></div>
    <p class="tiny faint mt">Compare the total, not just the base salary. Benefits value = retirement match, insurance, stipends – roughly per year. ${tgt ? "" : "Add your target salary in Settings to see the difference."}</p>`;
}

/* add/edit a job, job details, interviews (with notes), offers, emails */

let FORM = {};

// ------------------------------------------------------------ add / edit a job
function appModal(id, pre = {}) {

    <div class="frow">${fld("Application deadline", `<input class="inp" type="date" id="fDl" value="${a.deadline || ""}">`)}${fld("Date applied", `<input class="inp" type="date" id="fAp" value="${a.applied || ""}">`)}</div>
    <div class="frow">${fld("How you applied", `<select class="inp" id="fMeth">${opt("", "–", a.method)}${Object.entries(METHOD).map(([k, n]) => opt(k, n, a.method)).join("")}</select>`)}${fld("Interest", `<div class="seg" id="fInt">${[[1, "Low"], [2, "Medium"], [3, "High"]].map(([k, n]) => `<button type="button" class="${a.interest === k ? "on" : ""}" data-act="fInt" data-v="${k}">${n}</button>`).join("")}</div>`)}</div>

function appSave(id) {
  const co = val("fCo"), ro = val("fRo");

  let a = id ? appById(id) : null; const isNew = !a, oldDl = a ? a.deadline : "";
  const pasted = $("#fPaste") ? $("#fPaste").value.trim() : "";
  commit(() => {
    if (!a) { a = { id: uid(), status: "wish", history: [], followed: [], created: today(), interest: 2 }; S.apps.unshift(a); }

/* Save a job in one go: paste the ad (phone) or one click on the job page (computer bookmark) → fields fill themselves */
const TITLEW = /\b(manager|engineer|developer|designer|analyst|specialist|coordinator|director|lead|head of|assistant|associate|consultant|nurse|teacher|intern|internship|representative|officer|administrator|scientist|marketer|writer|editor|accountant|technician|architect|strategist|producer|planner|supervisor|executive|advisor|agent|recruiter|clerk|therapist|pharmacist|cashier|driver|operator|instructor|researcher|owner|partner|vp|president|chief)\b/i;
const stripHtml = h => String(h || "").replace(/<(br|\/p|\/li|\/h\d|\/div)[^>]*>/gi, "\n").replace(/<li[^>]*>/gi, "• ").replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;|&rsquo;/g, "’").replace(/&quot;/g, '"').replace(/\n{3,}/g, "\n\n").trim();
function curFrom(s) { return /CHF/.test(s) ? "CHF" : /€|EUR/.test(s) ? "EUR" : /£|GBP/.test(s) ? "GBP" : /(CA|C)\$|CAD/.test(s) ? "CAD" : /A\$|AUD/.test(s) ? "AUD" : /\$|USD/.test(s) ? "USD" : ""; }
function payFrom(t) {
  const m = String(t).match(/(?:[$€£]|CHF|USD|EUR|GBP|CAD|AUD)\s?\d[\d,.']*\s?[kK]?(?:\s?(?:-|–|to)\s?(?:[$€£]|CHF)?\s?\d[\d,.']*\s?[kK]?)?(?:\s*(?:per|\/|an?)\s*(hour|hr|year|yr|annum|month))?/i);
  if (!m) return null;
  let n = parseMoney(m[0].replace(/'/g, "")); const per = (m[1] || "").toLowerCase();
  if (/hour|hr/.test(per)) n = n.map(x => Math.round(x * 2080)); else if (/month/.test(per)) n = n.map(x => x * 12);
  n = n.filter(x => x >= 1000); if (!n.length) return null;
  return { min: Math.min(...n), max: Math.max(...n), cur: curFrom(m[0]) };
}
// read a pasted job ad
function parseAd(text, url = "") {

  o.role = (L.slice(0, 10).find(l => l.length <= 90 && TITLEW.test(l) && !/^(about|we|our|you|the|this|job|apply|responsib|requir)/i.test(l)) || (L[0] && L[0].length <= 80 ? L[0] : "")).replace(/\s*[-–|]\s*(remote|hybrid|full[- ]time).*$/i, "").replace(/^job title:?\s*/i, "");
  const co = t.match(/(?:^|\n)\s*(?:company|employer|organi[sz]ation)\s*[:\-]\s*([^\n]{2,60})/i) || t.match(/(?:^|\n)\s*([A-Z][\w&.'’\- ]{1,40}?)\s+is\s+(?:hiring|looking|seeking|searching)/) ||
    t.match(/(?:^|\n)\s*About\s+(?!the role|the job|the team|you|us)([A-Z][\w&.'’\- ]{1,40})\s*\n/) || t.match(/\b(?:join|at)\s+([A-Z][\w&.'’\-]+(?:\s[A-Z&][\w&.'’\-]+){0,3})(?=[,.!\n]| as | is | we | where)/) ||
    (L[1] && L[1].length < 50 && !TITLEW.test(L[1]) && /^[A-Z]/.test(L[1]) && !/,\s*[A-Z]{2}\b|remote/i.test(L[1]) ? [0, L[1]] : null);
  if (co) o.company = co[1].trim().replace(/[.,]$/, "");
  const loc = t.match(/(?:^|\n)\s*location\s*[:\-]\s*([^\n]{2,60})/i) || t.match(/\b([A-Z][a-zA-Z.]+(?:[ -][A-Z][a-zA-Z.]+){0,2},\s?(?:[A-Z]{2}|[A-Z][a-z]{3,}))\b/);
  if (loc) o.location = loc[1].trim();
  o.work = /\bhybrid\b/i.test(t) ? "hybrid" : /\b(fully remote|100% remote|remote[- ]first|work from home|remote\b)/i.test(t) && !/not remote|no remote/i.test(t) ? "remote" : /\bon[- ]?site\b|in[- ]office/i.test(t) ? "onsite" : "";
  if (!o.location && o.work === "remote") o.location = "Remote";
  o.type = /\bintern(ship)?\b/i.test(t) ? "intern" : /\bpart[- ]time\b/i.test(t) ? "part" : /\b(contract|contractor|freelance|temporary|temp)\b/i.test(t) ? "contract" : /\bfull[- ]time\b/i.test(t) ? "full" : "";
  const p = payFrom(t); if (p) { o.salMin = p.min; o.salMax = p.max; if (p.cur) o.cur = p.cur; }
  const dl = t.match(/(?:apply by|deadline|closing date|applications close|closes on|valid through)\s*:?\s*([A-Za-z]{3,9}\.? \d{1,2},? \d{4}|\d{1,2}[./-]\d{1,2}[./-]\d{2,4}|\d{4}-\d\d-\d\d|\d{1,2} [A-Za-z]{3,9} \d{4})/i);
